name: Draw on the screen test

# Real Windows test of plugins/screen_draw.py with the real mouse and keyboard.
on:
  pull_request:
    paths: ["plugins/screen_draw.py", "packaging/draw_selftest.py", "core/plugin_loader.py", ".github/workflows/draw-test.yml"]
  push:
    branches: [main]
    paths: ["plugins/screen_draw.py", "packaging/draw_selftest.py"]
  workflow_dispatch:

jobs:
  draw:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install PyQt6 pyautogui
      - name: Draw on the screen test (real mouse + keyboard)
        run: python packaging/draw_selftest.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draw-screenshots
          path: "draw*_selftest.png"
          if-no-files-found: ignore
