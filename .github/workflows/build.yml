name: Build Habibi

# Every push to main builds:
#   • HabibiSetup.exe + Habibi-Windows-portable.zip  (Windows)
#   • Habibi.apk                                     (Android phone app)
# and publishes them on the "Latest build" release page.
# Pushing a tag like v1.0.0 makes a versioned release instead.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller fastapi "uvicorn[standard]" cryptography python-multipart "qrcode[pil]"
          pip install openwakeword || echo "openwakeword skipped (wake word will be unavailable)"

      - name: Build Habibi.exe
        run: python packaging/build_exe.py

      - name: Build installer (HabibiSetup.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $ver = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") { $ver = "1.0.${{ github.run_number }}" }
          $env:HABIBI_VERSION = $ver.TrimStart("v")
          & $iscc packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Habibi-Windows
          path: |
            dist/HabibiSetup.exe
            dist/Habibi-Windows-portable.zip

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone_app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Habibi.apk
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Habibi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Habibi-Android
          path: Habibi.apk

  release:
    name: Publish downloads
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true

      - name: Replace "Latest build" release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "${{ github.repository }}" --cleanup-tag --yes || true
          gh release create latest out/* --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --prerelease \
            --title "Latest build" \
            --notes "Automatic build of commit ${{ github.sha }}. Windows: HabibiSetup.exe (installer) or Habibi-Windows-portable.zip. Android: Habibi.apk."
