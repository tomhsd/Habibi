name: Build Habibi

# Every push to main builds:
#   • HabibiOnlineSetup.exe  + Habibi-Online-Windows-portable.zip   (Windows, Gemini Live only)
#   • HabibiOfflineSetup.exe + Habibi-Offline-Windows-portable.zip  (Windows, plus offline mode)
#   • Habibi.apk                                     (Android phone app)
# and publishes them on the "Latest build" release page.
# Pushing a tag like v1.0.0 makes a versioned release instead.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller fastapi "uvicorn[standard]" cryptography python-multipart "qrcode[pil]"
          pip install openwakeword || echo "openwakeword skipped (wake word will be unavailable)"
          pip install sherpa-onnx
          python -m playwright install chromium   # browser for the phone voice test
          mkdir -p config/models
          curl -fsSL -o config/models/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx

      - name: Self-test Windows encryption (DPAPI)
        run: >-
          python -c "import tempfile, os; from core import secure as s;
          v = s.protect('test-123'); assert v.startswith('dpapi:') and s.reveal(v) == 'test-123', 'value';
          p = os.path.join(tempfile.gettempdir(), 'mem.json'); s.write_protected_text(p, '{}');
          assert open(p).read().startswith('HABIBI-DPAPI-1') and s.read_protected_text(p) == '{}', 'file';
          print('DPAPI self-test OK')"

      - name: Offline mode test (online/offline switch, voice takeover)
        run: python packaging/offline_selftest.py

      - name: Phone voice test (hold-to-talk, captions, no self-interruption)
        run: python packaging/phone_voice_selftest.py

      - name: Real Windows test of computer-control skills
        continue-on-error: true
        run: python packaging/smoke_test_windows.py

      - name: Media player test (play, analyse, RGB, controls)
        continue-on-error: true
        run: python packaging/media_selftest.py

      - name: Equalizer test (bands, bass, beat, presets, voice, sound path)
        continue-on-error: true
        run: python packaging/equalizer_selftest.py

      - name: YouTube in the media player test
        continue-on-error: true
        run: python packaging/youtube_selftest.py

      - name: Custom logo test (window, header, shortcuts, taskbar pins)
        run: python packaging/logo_selftest.py

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: "*_selftest*.png"
          if-no-files-found: ignore

      - name: Screen-control demo (capture + interact)
        continue-on-error: true
        run: python examples/screen_control_demo.py

      - name: Build Habibi.exe (Online and Offline editions)
        run: |
          python packaging/build_exe.py --edition online
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/build_exe.py --edition offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check both editions (media player inside, offline mode only in Offline)
        shell: pwsh
        run: |
          foreach ($e in "Online", "Offline") {
            $app = "dist/$e/Habibi"
            if (-not (Test-Path "$app/Habibi.exe")) { Write-Error "$e`: Habibi.exe missing"; exit 1 }
            $m = Get-ChildItem $app -Recurse -Include "*Multimedia*.dll" | Select-Object -ExpandProperty Name
            if (-not ($m -match "Qt6Multimedia")) { Write-Error "$e`: Qt Multimedia missing from the build"; exit 1 }
            $off = Test-Path "$app/plugins/offline_mode.py"
            $piper = [bool](Get-ChildItem $app -Recurse -Directory -Filter "piper" -ErrorAction SilentlyContinue)
            "$e edition: offline_mode=$off piper=$piper plugins=$((Get-ChildItem "$app/plugins" -Filter *.py).Count)"
            if ($e -eq "Online"  -and ($off -or $piper)) { Write-Error "Online edition must not contain offline mode"; exit 1 }
            if ($e -eq "Offline" -and -not $off)        { Write-Error "Offline edition is missing offline mode"; exit 1 }
          }

      - name: Build installers (HabibiOnlineSetup.exe, HabibiOfflineSetup.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $ver = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") { $ver = "1.0.${{ github.run_number }}" }
          $env:HABIBI_VERSION = $ver.TrimStart("v")
          foreach ($e in "Online", "Offline") {
            $env:HABIBI_EDITION = $e
            & $iscc packaging\installer.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Habibi-Windows
          path: |
            dist/HabibiOnlineSetup.exe
            dist/HabibiOfflineSetup.exe
            dist/Habibi-Online-Windows-portable.zip
            dist/Habibi-Offline-Windows-portable.zip

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone_app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Habibi.apk (signed with the permanent Habibi key)
        env:
          KS_B64: ${{ secrets.HABIBI_KEYSTORE_B64 }}
          HABIBI_KEYSTORE_PASSWORD: ${{ secrets.HABIBI_KEYSTORE_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/habibi.jks"
            export HABIBI_KEYSTORE="$RUNNER_TEMP/habibi.jks"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Habibi.apk
            rm -f "$RUNNER_TEMP/habibi.jks"
          else
            echo "::warning::Secret HABIBI_KEYSTORE_B64 is not set - using a temporary key. Phones can't install this as an update; add the secrets (see signing/README-KEEP-SAFE.txt on the PC)."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Habibi.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Habibi-Android
          path: Habibi.apk

  release:
    name: Publish downloads
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true

      - name: Replace "Latest build" release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "${{ github.repository }}" --cleanup-tag --yes || true
          gh release create latest out/* --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --prerelease \
            --title "Latest build" \
            --notes "Automatic build of commit ${{ github.sha }}. Windows, two separate editions: HabibiOnlineSetup.exe (Gemini Live, needs internet) or HabibiOfflineSetup.exe (also works without internet: local voice + Ollama). Portable zips of each. Android: Habibi.apk."
