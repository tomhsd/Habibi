name: Custom logo test

# Real Windows test: the user's picture becomes Habibi's logo on the window,
# header and real .lnk shortcuts (desktop, Start menu, taskbar pins).
on:
  pull_request:
    paths: ["plugins/custom_logo.py", "plugins/_logo_core.py", "packaging/logo_selftest.py",
            "ui.py", ".github/workflows/logo-test.yml"]
  workflow_dispatch:

jobs:
  logo:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Custom logo test
        run: python packaging/logo_selftest.py
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logo-screenshot
          path: "logo_selftest.png"
          if-no-files-found: ignore
