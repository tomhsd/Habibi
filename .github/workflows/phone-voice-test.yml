name: Phone voice test

# Real Windows test of talking to Habibi from the phone: hold-to-talk route,
# live captions, Habibi ignoring its own voice (phone and PC), and the real
# phone page in Chromium with a fake microphone.
on:
  pull_request:
    paths: ["plugins/phone_voice.py", "plugins/offline_mode.py", "packaging/phone_voice_selftest.py",
            "core/barge_in.py", "core/plugin_loader.py", "dashboard/**", "main.py",
            ".github/workflows/phone-voice-test.yml"]
  workflow_dispatch:

jobs:
  phone-voice:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fastapi "uvicorn[standard]" cryptography python-multipart httpx playwright
          python -m playwright install chromium
      - name: Phone voice test
        run: python packaging/phone_voice_selftest.py
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-voice-screenshot
          path: "phone_voice_selftest.png"
          if-no-files-found: ignore
