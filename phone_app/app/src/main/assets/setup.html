<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Habibi</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pri: #00d4ff; --bg: #00060a; --panel: #010d14; --card: #02121c;
      --border: #0d3347; --border-b: #1a5c7a; --pri-gho: #001f2e;
      --text: #8ffcff; --dim: #3a8a9a; --white: #d8f8ff;
      --acc2: #ffcc00; --green: #00ff88; --red: #ff3355;
      --mono: Consolas, 'Roboto Mono', 'Droid Sans Mono', monospace;
    }
    html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono);
                 -webkit-tap-highlight-color: transparent; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: linear-gradient(rgba(0,212,255,.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0,212,255,.05) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    body::after {
      content: ''; position: fixed; left: 0; right: 0; height: 120px; top: -120px; pointer-events: none; z-index: 3;
      background: linear-gradient(180deg, transparent, rgba(0,212,255,.07) 60%, rgba(0,212,255,.16) 98%, transparent);
      animation: scan 7s linear infinite;
    }
    @keyframes scan { to { transform: translateY(calc(100vh + 120px)); } }
    .wrap { position: relative; z-index: 1; padding: 26px 20px 30px; max-width: 460px; margin: 0 auto; }
    #core { display: block; width: 170px; height: 170px; margin: 0 auto; }
    h1 { text-align: center; color: var(--white); font-size: 28px; letter-spacing: 10px; margin-top: 6px;
         animation: glow 3.2s ease-in-out infinite; }
    @keyframes glow {
      0%,100% { text-shadow: 0 0 8px rgba(0,212,255,.45); }
      50%     { text-shadow: 0 0 18px var(--pri), 0 0 34px rgba(0,212,255,.45); }
    }
    .sub { text-align: center; color: var(--pri); font-size: 11px; letter-spacing: 4px; margin: 6px 0 22px; }
    .cut { clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
    .panel { background: var(--card); border: 1px solid var(--border); padding: 16px; margin-top: 12px;
             box-shadow: inset 0 0 22px rgba(0,212,255,.05); }
    .lbl { font-size: 9px; letter-spacing: 3px; color: var(--dim); margin-bottom: 6px; }
    input[type=text], input[type=url] {
      width: 100%; padding: 13px 12px; background: var(--bg); border: 1px solid var(--border-b);
      color: var(--white); font-family: var(--mono); font-size: 14px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: var(--pri); box-shadow: 0 0 0 1px var(--pri), 0 0 16px rgba(0,212,255,.3); }
    input::placeholder { color: var(--dim); }
    .btn { width: 100%; margin-top: 16px; padding: 15px; border: none; background: var(--pri); color: var(--bg);
           font-family: var(--mono); font-weight: 700; font-size: 13px; letter-spacing: 4px;
           box-shadow: 0 0 18px rgba(0,212,255,.5); animation: btnGlow 2.6s ease-in-out infinite; }
    @keyframes btnGlow { 0%,100% { box-shadow: 0 0 10px rgba(0,212,255,.35); } 50% { box-shadow: 0 0 26px rgba(0,212,255,.8); } }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .5; animation: none; }
    .note { font-size: 11px; color: var(--dim); line-height: 1.6; }
    .note b { color: var(--white); }
  </style>
  <style>
    .chk { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; font-size: 11px; color: var(--dim); line-height: 1.5; }
    .chk input { margin-top: 2px; accent-color: var(--pri); width: 18px; height: 18px; flex-shrink: 0; }
    #msg { min-height: 18px; margin-top: 12px; font-size: 12px; text-align: center; letter-spacing: 1px; }
    #msg.err { color: var(--red); } #msg.ok { color: var(--green); } #msg.busy { color: var(--acc2); }
    #key { text-align: center; font-size: 24px; font-weight: 700; letter-spacing: 10px; text-transform: uppercase; }
    .field + .field { margin-top: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="core"></canvas>
    <h1>HABIBI</h1>
    <div class="sub">◉ PHONE LINK SETUP</div>

    <div class="panel cut note">
      1. On your PC, open Habibi and press <b>REMOTE CONTROL</b>.<br>
      2. Type the <b>address</b> shown under the QR code and the <b>6-letter key</b>.
    </div>

    <div class="panel cut">
      <div class="field">
        <div class="lbl">HABIBI ADDRESS</div>
        <input id="server" type="url" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="https://your-pc.tailXXXX.ts.net:8000">
      </div>
      <div class="field">
        <div class="lbl">6-LETTER KEY</div>
        <input id="key" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="······">
      </div>
      <div class="field">
        <div class="lbl">PHONE NAME</div>
        <input id="name" type="text" autocomplete="off">
      </div>
      <label class="chk"><input id="self" type="checkbox">
        <span>No Tailscale: trust my PC's own certificate (home Wi-Fi only)</span></label>
      <button class="btn cut" id="pair">PAIR ▸</button>
      <div id="msg"></div>
    </div>
  </div>

  <script>
    const B = window.HabibiSetup;
    const $ = id => document.getElementById(id);
    $('server').value = B ? B.savedServer() : '';
    $('name').value   = B ? B.deviceName() : 'Phone';
    $('self').checked = B ? B.savedSelfSigned() : false;
    $('key').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z2-9]/g, ''); });

    function show(text, cls) { const m = $('msg'); m.textContent = text; m.className = cls || ''; }

    $('pair').onclick = () => {
      const server = $('server').value.trim(), key = $('key').value.trim();
      if (server.length < 8 || key.length !== 6) { show('Enter the address and the 6-letter key.', 'err'); return; }
      $('pair').disabled = true;
      coreState.label = 'LINKING'; coreState.color = '#ffcc00';
      show('PAIRING…', 'busy');
      B.pair(server, key, $('name').value.trim(), $('self').checked);
    };

    // called by the app when pairing finishes
    window.onPair = (ok, text) => {
      $('pair').disabled = false;
      if (ok) { coreState.label = 'LINKED'; coreState.color = '#00ff88'; coreState.boost = 1; show('LINKED ✓', 'ok'); }
      else    { coreState.label = 'STANDBY'; coreState.color = '#ff3355'; coreState.boost = .6; show(text, 'err');
                setTimeout(() => { coreState.color = '#00d4ff'; }, 1800); }
    };
    // Animated reactor core (same look as the desktop HUD)
    (function () {
      const cv = document.getElementById('core'), x = cv.getContext('2d');
      const W = 340, c = W / 2; cv.width = W; cv.height = W;
      window.coreState = { label: 'STANDBY', color: '#00d4ff', boost: 0 };
      function rgba(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
      function f(t) {
        const s = t / 1000, st = window.coreState, col = st.color;
        st.boost *= 0.95;
        const p = 0.5 + 0.5 * Math.sin(s * 1.8), b = st.boost;
        x.clearRect(0, 0, W, W);
        const g = x.createRadialGradient(c, c, W * .15, c, c, W * .5);
        g.addColorStop(0, rgba(col, .14 + .1 * p + .25 * b)); g.addColorStop(1, rgba(col, 0));
        x.fillStyle = g; x.fillRect(0, 0, W, W);
        x.save(); x.translate(c, c); x.rotate(s * .08);
        for (let i = 0; i < 72; i++) {
          const a = i / 72 * Math.PI * 2, L = i % 6 === 0, r1 = W * .47, r2 = r1 - (L ? W * .035 : W * .018);
          x.strokeStyle = rgba(col, L ? .75 : .3); x.lineWidth = L ? 2 : 1;
          x.beginPath(); x.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); x.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); x.stroke();
        }
        x.restore();
        [[.405, 3, 3, .9, .5, .85], [.365, 1.5, 5, .5, -.8, .55], [.325, 5, 2, 1.2, .35 + b * 3, .75]].forEach(([r, w, n, len, sp, a]) => {
          x.strokeStyle = rgba(col, a); x.lineWidth = w;
          for (let i = 0; i < n; i++) { const q = s * sp + i * Math.PI * 2 / n; x.beginPath(); x.arc(c, c, W * r, q, q + len); x.stroke(); }
        });
        const rc = W * (.27 + .008 * p + .02 * b);
        const pg = x.createRadialGradient(c, c, 0, c, c, rc);
        pg.addColorStop(0, rgba(col, .25)); pg.addColorStop(.7, 'rgba(1,13,20,.98)'); pg.addColorStop(1, 'rgba(0,6,10,.98)');
        x.fillStyle = pg; x.strokeStyle = rgba(col, .8); x.lineWidth = 2 + 2 * b;
        x.shadowColor = col; x.shadowBlur = 14 + 20 * p + 30 * b;
        x.beginPath(); x.arc(c, c, rc, 0, Math.PI * 2); x.fill(); x.stroke(); x.shadowBlur = 0;
        x.textAlign = 'center'; x.textBaseline = 'middle';
        x.font = '700 30px Consolas, monospace'; x.fillStyle = '#d8f8ff'; x.shadowColor = col; x.shadowBlur = 12;
        x.fillText('HABIBI', c, c - 8); x.shadowBlur = 0;
        x.font = '700 13px Consolas, monospace'; x.fillStyle = col; x.fillText(st.label, c, c + 24);
        requestAnimationFrame(f);
      }
      requestAnimationFrame(f);
    })();
  </script>
</body>
</html>
